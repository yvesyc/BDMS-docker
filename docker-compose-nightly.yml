version: '3.4'
services:
  BDMS-server:
    container_name: BDMS-server
    # nightly 为每日构建
    image: ghcr.io/yvesyc/BDMS-server:nightly
    # 自己构建..
    # build:
    #   context: .
    #   dockerfile: Dockerfile-server
    environment:
      TZ: Asia/Shanghai
    ports:
      # Web 由nginx路由
      # - "8686:8686" 
      # Login server
      - "8484:8484"
      # Channels.
      - "7575-7577:7575-7577"
    # 如果要挂载wz scripts 取消注释 volumes 设置
    # 注意 命令行参数的优先级高于 application.yml 配置文件
    volumes:
      - ./BDMS-server-nightly:/opt/server
    command:
      - --mybatis-flex.datasource.mysql.url=jdbc:mysql://BDMS-db:3306/BDMS?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      - --mybatis-flex.datasource.mysql.username=root
      - --mybatis-flex.datasource.mysql.password=root
      - --gms.service.wan-host=127.0.0.1
      - --gms.service.lan-host=127.0.0.1
      - --gms.service.localhost=127.0.0.1
      #  如果前端访问失败，可以尝试修改↓
      # - --app.vue=<前端url>
      #  生产环境请自行生成密钥,并关闭 swagger
      # - --jwt.secret=50da066e-6080-40f5-a173-86bd27d4f674
      # - --springdoc.api-docs.enabled=true
      # - --springdoc.swagger-ui.enabled=true
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tunlp | grep 0.0.0.0:8484 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      BDMS-db:
        condition: service_healthy
    networks:
      - BDMS-network

  BDMS-ui:
    container_name: BDMS-ui
    # nightly 为每日构建
    image: ghcr.io/yvesyc/BDMS-ui:nightly
    # 自己构建..
    # build:
    #   context: .
    #   dockerfile: Dockerfile-ui
    # 可以挂载出来 修改端口，添加证书
    # volumes:
    #   - ./nginx-ui.conf:/etc/nginx/conf.d/default.conf
    ports:
      # Web
      - "8686:8686"
    depends_on:
      - BDMS-server
    networks:
      - BDMS-network
      
  BDMS-db:
    container_name: BDMS-db
    image: mysql:8.4.0
    environment:
      # mysql root 默认密码
      MYSQL_ROOT_PASSWORD: "root" 
    ports:
      - "3306:3306"
    volumes:
      - ./docker-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - BDMS-network

networks:
  BDMS-network:
    driver: bridge
